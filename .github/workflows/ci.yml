name: CI Validation & Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    name: Lint, Promtool & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Custom Configuration Validation Script
        run: |
          python scripts/validate.py

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose config -q

      - name: Validate Prometheus Configuration with Promtool
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/config/prometheus:/etc/prometheus:ro \
            prom/prometheus:v2.54.1 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus Alert Rules with Promtool
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/config/prometheus:/etc/prometheus:ro \
            prom/prometheus:v2.54.1 \
            promtool check rules /etc/prometheus/alert.rules.yml
