# snmp_exporter configuration file
# This module definition is based on the standard IF-MIB / ifMIB metrics (RFC 1213 / RFC 2863).
# Generated with the official snmp_exporter generator.

if_mib:
  walk:
    - 1.3.6.1.2.1.1.3         # sysUpTime
