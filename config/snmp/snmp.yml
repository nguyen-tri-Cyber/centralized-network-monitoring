  metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: The time (in hundredths of a second) since the network management portion of the system was last re-initialized.
    - name: ifIndex
      oid: 1.3.6.1.2.1.2.2.1.1
      type: gauge
      help: A unique value, greater than zero, for each interface.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifDescr
      oid: 1.3.6.1.2.1.2.2.1.2
      type: DisplayString
      help: A textual string containing information about the interface.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifType
      oid: 1.3.6.1.2.1.2.2.1.3
      type: gauge
      help: The type of interface.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifSpeed
      oid: 1.3.6.1.2.1.2.2.1.5
      type: gauge
      help: An estimate of the interface's current bandwidth in bits per second.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifAdminStatus
      oid: 1.3.6.1.2.1.2.2.1.7
      type: gauge
      help: The desired state of the interface (1=up, 2=down, 3=testing).
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifOperStatus
      oid: 1.3.6.1.2.1.2.2.1.8
      type: gauge
      help: The current operational state of the interface (1=up, 2=down, 3=testing, 4=unknown, 5=dormant, 6=notPresent, 7=lowerLayerDown).
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifInOctets
      oid: 1.3.6.1.2.1.2.2.1.10
      type: counter
      help: The total number of octets received on the interface, including framing characters.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifInErrors
      oid: 1.3.6.1.2.1.2.2.1.14
      type: counter
      help: For packet-oriented interfaces, the number of inbound packets that contained errors.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifInDiscards
      oid: 1.3.6.1.2.1.2.2.1.13
      type: counter
      help: The number of inbound packets which were chosen to be discarded even though no errors had been detected.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifOutOctets
      oid: 1.3.6.1.2.1.2.2.1.16
      type: counter
      help: The total number of octets transmitted out of the interface, including framing characters.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifOutDiscards
      oid: 1.3.6.1.2.1.2.2.1.19
      type: counter
      help: The number of outbound packets which were chosen to be discarded even though no errors had been detected.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifOutErrors
      oid: 1.3.6.1.2.1.2.2.1.20
      type: counter
      help: For packet-oriented interfaces, the number of outbound packets that contained errors.
      indexes:
        - labelname: ifIndex
          type: gauge
    - name: ifName
      oid: 1.3.6.1.2.1.31.1.1.1.1
      type: DisplayString
