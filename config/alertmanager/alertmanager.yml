global:
  resolve_timeout: 5m

# The root route on which each incoming alert enters.
route:
  group_by: ["alertname", "instance", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: "webhook-placeholder"

  # Route critical alerts immediately if needed
  routes:
    - match:
        severity: critical
      receiver: "webhook-placeholder"
      repeat_interval: 1h

# Documented receivers.
# In a real environment, configure integrations such as Slack, Email, PagerDuty, or Discord.
# In this lab, a safe webhook placeholder receiver is configured (no secrets or real credentials required).
receivers:
  - name: "webhook-placeholder"
    webhook_configs:
      - url: "http://host.docker.internal:5001/api/alerts"
        send_resolved: true
        max_alerts: 10

# Inhibition rules: mute warning alerts if critical alert is already firing
inhibit_rules:
  - source_match:
      alertname: "SNMPTargetDown"
      severity: "critical"
    target_match:
      alertname: "NetworkInterfaceDown"
    equal: ["instance"]
